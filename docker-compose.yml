# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy: chat + redis + nginx (load balancer)
#
#   docker compose up -d                  # 1 instance chat
#   docker compose up -d --scale chat=3   # 3 instance, nginx chia tải
#
# Cổng vào duy nhất là localhost:8000, do nginx map 8000:80.
# Service `chat` KHÔNG map cổng ra host để scale không bị xung đột cổng.
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    expose:
      - "8000"
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      BUCKET_CAPACITY: "10"
      REFILL_PER_MINUTE: "10"
      DAILY_BUDGET_USD: "1.0"
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat

volumes:
  redis-data:
